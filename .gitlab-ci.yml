stages: 
  - testMain

build:
  stage: testMain
  tags:
    - docker-automation-test  
  script:
    - apk add jq
    - arr=${PRODUCT//,/ }
    - >
      if [ "$PRODUCT" != "" ] || [ "$PRODUCT" != " " ] ;then
              if [ "$PRODUCT" == "ALL" ] ;then
            for i in $LIST_GAME ; do
            isRun=1
            isReady=0
              while [[ $isReady == 0 ]] ; do
                countStatus=$(curl --header "PRIVATE-TOKEN:qgqeyvxnxpsJRp9jwrkj" "https://git3.nexdev.net/api/v4/projects/910/pipelines?scope=running" | jq length)
                if [ $countStatus -lt $TOTALRUNNER ] ;then
              isReady=1
              echo "game name ${i}"
              curl -X POST -F token=893c63a78c9e7b50990578047681d8 -F ref=dev -F variables[GAMEID]=$i -F variables[ENV]=$ENV -F variables[TRIGGER]=true -F variables[parentTrigger]=$CI_PIPELINE_ID https://git3.nexdev.net/api/v4/projects/910/trigger/pipeline
              sleep 2
            else
             sleep 20
            fi
                  sleep 2
          done
          done
          fi

      if [ "$PRODUCT" != "ALL" ] ;then
            for i in $PRODUCT ; do
            isRun=1
            isReady=0
              while [[ $isReady == 0 ]] ; do
                countStatus=$(curl --header "PRIVATE-TOKEN:qgqeyvxnxpsJRp9jwrkj" "https://git3.nexdev.net/api/v4/projects/910/pipelines?scope=running" | jq length)
                echo "current job running ${countStatus}"
                if [ $countStatus -lt $TOTALRUNNER ] ;then
              isReady=1
              echo "game name ${i}"
              curl -X POST -F token=893c63a78c9e7b50990578047681d8 -F ref=dev -F variables[GAMEID]=$i -F variables[ENV]=$ENV -F variables[TRIGGER]=true -F variables[parentTrigger]=$CI_PIPELINE_ID https://git3.nexdev.net/api/v4/projects/910/trigger/pipeline
              sleep 2
            else
             sleep 20
            fi
                  sleep 2
          done
          done
          fi 

        if [[ $isRun == 1 ]] ; then      
        iscompleted=0
        while [[ $iscompleted == 0 ]] ; do
                  countStatus1=$(curl --header "PRIVATE-TOKEN:qgqeyvxnxpsJRp9jwrkj" "https://git3.nexdev.net/api/v4/projects/910/pipelines?scope=running" | jq length)
                  echo "$countStatus1"
                  if [ $countStatus1 -lt 1 ] ; then
                  iscompleted=1
                    if [ "$PRODUCT" == "ALL" ] ;then
                        echo "run all games"
                       totalgames=$(echo -n "$LIST_GAME" | wc -w)
                      latestpipeline=$(curl --header "PRIVATE-TOKEN:qgqeyvxnxpsJRp9jwrkj" "https://git3.nexdev.net/api/v4/projects/910/pipelines?per_page=${totalgames}"  | jq -r '.[].status') 
                      else
                      totalgames=$(echo -n "$arr" | wc -w)
                        latestpipeline=$(curl --header "PRIVATE-TOKEN:qgqeyvxnxpsJRp9jwrkj" "https://git3.nexdev.net/api/v4/projects/910/pipelines?per_page=${totalgames}"  | jq -r '.[].status') 
                    fi
                else      
                sleep 30
                  fi
             done
                     jobresult=1   
                     SUB="failed"
                     case $latestpipeline in *"$SUB"*)
                        jobresult=0
                     esac
                      if [ $jobresult == 0 ] ; then
                        echo "job failed"
                        exit 1
                        else
                        echo "job passed"
                        exit 0
                      fi
                                            fi
                                                    
      fi
