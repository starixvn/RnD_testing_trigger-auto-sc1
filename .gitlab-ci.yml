stages: 
  - testMain

build:
  stage: testMain
  tags:
    - docker-automation-test
  variables:
    LIST_GAME: "Sedie VIpSedie TurboBigSmall BigSmall MiniSedie BigSmallSicBo BlackJack SedieWar TurboOddEven"
  script:
    - apk add jq
    - >
      for i in $LIST_GAME ; do
        listGame=$(echo ${i} | tr '[:upper:]' '[:lower:]')
        for g in $PRODUCT ; do
            product=$(echo ${g} | tr '[:upper:]' '[:lower:]')
            if [ "$product" == "$listGame" ] || [ "$product" == "all" ] ;
            then
                isReady=0
                while [[ $isReady == 0 ]] ; do
                  countStatus=$(curl --header "PRIVATE-TOKEN:vuLfNcDKeAFFXnd43SFa" "https://git3.nexdev.net/api/v4/projects/253/pipelines?scope=running" | jq length)
                  echo "$countStatus"
                  if [ $countStatus -lt 3 ] ;
                  then
                    isReady=1
                    curl -X POST -F token=0f21176112256c893237283ca56f7b -F ref=master -F variables[PRODUCT]=$i -F variables[env]=$env -F variables[Mode]=$Mode https://git3.nexdev.net/api/v4/projects/253/trigger/pipeline
                  else
                    sleep 20
                  fi
                  sleep 5
                done
            fi
        done
      done










