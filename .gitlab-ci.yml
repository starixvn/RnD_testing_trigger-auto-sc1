stages: 
  - testMain
  - testSub1

testSedie:
  stage: testMain
  variables:
    PRODUCT: Sedie
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: '$PRODUCT =~ /(^SEDIE|[^P]SEDIE)/'
    - if: $PRODUCT == "All"
testVipSedie:
  stage: testMain
  variables:
    PRODUCT: VIpSedie
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: '$PRODUCT =~ /VIPSEDIE/'
    - if: $PRODUCT == "All"
