stages: 
  - testMain

build:
  stage: testMain
  tags:
    - docker-automation-test
  variables:
    LIST_PROJECT: "SC SI SM"
  script:
    - apk add jq
    - arr=${PRODUCT//,/ }
    - >
      echo "$PROJECT"
      echo "$PRODUCT"
        if [ "$PROJECT" == "ALL" ]; then
          curl -X POST -F token=dafa1a4291029ab678f55ac052effd -F ref=main -F variables[PRODUCT]=$PRODUCT -F variables[ENV]=$ENV -F variables[parentTrigger]=$CI_PIPELINE_ID  https://git3.nexdev.net/api/v4/projects/557/trigger/pipeline
