stages: 
  - testMain
  - testSub1

testSedie:
  stage: testMain
  variables:
    PRODUCT: Sedie
    Mode: $Mode
    env: $env
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: '$PRODUCT =~ /(^SEDIE|[^PI]SEDIE)/'
    - if: $PRODUCT == "All"
