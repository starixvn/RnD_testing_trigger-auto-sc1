stages: 
  - testPhase1
  - testPhase2
  - testPhase3

testSedie:
  stage: testPhase1
  variables:
    PRODUCT: Sedie
    PRODUCTS: 'S"$PRODUCT"'
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: $PRODUCTS =~ /[^p]SEDIE/
    # - if: $PRODUCTS == "SAll"

