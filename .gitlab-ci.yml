stages: 
  - testMain1
  - testMain2
  - testSub1
  - testSub2

build:
  stage: testMain1
  variables:
    LIST_GAME: "Sedie MiniSedie VIpSedie"
  script:
    - >
      for i in $LIST_GAME ; do
        listGame=$(echo ${i} | tr '[:upper:]' '[:lower:]')
        for g in $PRODUCT ; do
            product=$(echo ${g} | tr '[:upper:]' '[:lower:]')
            if [ "$product" == "$listGame" ] || ["$product"] == "all"] ;
            then
                echo $i
                #curl -X POST -F token=0f21176112256c893237283ca56f7b -F ref=master -F variables[PRODUCT]=$i https://git3.nexdev.net/api/v4/projects/253/trigger/pipeline
            fi
        done
      done









