stages: 
  - testPhase1
  - testPhase2
  - testPhase3

testSedie:
  stage: testPhase1
  variables:
    PRODUCT: Sedie
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: 1$PRODUCT =~ /[^p]SEDIE/
    - if: $PRODUCT == "All"

testVipSedie:
  stage: testPhase1
  variables:
    PRODUCT: VIpSedie
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: 1$PRODUCT =~ /VIPSEDIE/
    - if: $PRODUCT == "All"

testBigSmall:
  stage: testPhase1
  variables:
    PRODUCT: BigSmall
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: 1$PRODUCT =~ /[^o]BIGSMALL/
    - if: $PRODUCT == "All"

testTurboBigSmall:
  stage: testPhase1
  variables:
    PRODUCT: TurboBigSmall
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: 1$PRODUCT =~ /TURBOBIGSMALL/
    - if: $PRODUCT == "All"

