              echo "$countStatusSi"
              echo "$countStatusSm"
                  if [ $countStatusSi -lt 1 ] && [ $countStatusSm -lt 1 ] && [ $countStatusSc -lt 1 ]; then
                  iscompleted=1
                  latestpipelineSi=$(curl --header "PRIVATE-TOKEN:7gzuEWsneR_orRsy7Tny" "https://git3.nexdev.net/api/v4/projects/557/pipelines?per_page=1"  | jq -r '.[].status') 
                  latestpipelineSm=$(curl --header "PRIVATE-TOKEN:h7_CwfF7VygPpjDKxJAR" "https://git3.nexdev.net/api/v4/projects/556/pipelines?per_page=1"  | jq -r '.[].status') 
                  latestpipelineSc=$(curl --header "PRIVATE-TOKEN:kvkJHvQnom4nRrypw2ck" "https://git3.nexdev.net/api/v4/projects/507/pipelines?per_page=1"  | jq -r '.[].status') 				  
                  echo "$latestpipelineSi"
                  echo "$latestpipelineSm"
                    else      
                        sleep 30
                  fi
        done
            jobresult=1   
            SUB="failed"
            case $latestpipelineSi in *"$SUB"*)
                jobresult=0
            esac
            case $latestpipelineSm in *"$SUB"*)
                        jobresult=0
                     esac
                      if [ $jobresult == 0 ] ; then
                        echo "job failed"
                        exit 1
                        else
                        echo "job passed"
                        exit 0
                      fi
        # PROJECT=SM
       elif [ "$PROJECT" == "SM" ]; then  
