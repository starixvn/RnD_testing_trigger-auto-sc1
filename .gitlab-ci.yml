stages: 
  - testPhase1
  - testPhase2
  - testPhase3


testSerial:
  stage: testPhase1
  variables:
    PRODUCT: "${PRODUCT}"
  trigger: rnd/testing/mocha-playwright
  rules:
    - if: $PRODUCT != "All"

testSedie:
  stage: testPhase1
  variables:
    PRODUCT: Sedie
  trigger: rnd/testing/mocha-playwright
  rules:
    - if: $PRODUCT == "All"

testVipSedie:
  stage: testPhase1
  variables:
    PRODUCT: VIpSedie
  trigger: rnd/testing/mocha-playwright
  rules:
    - if: $PRODUCT == "All"

testBigSmall:
  stage: testPhase1
  variables:
    PRODUCT: BigSmall
  trigger: rnd/testing/mocha-playwright
  rules:
    - if: $PRODUCT == "All"

testTurboBigSmall:
  stage: testPhase1
  variables:
    PRODUCT: TurboBigSmall
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: $PRODUCT == "All"

testMiniSedie:
  stage: testPhase2
  variables:
    PRODUCT: MiniSedie
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: $PRODUCT == "All"

testTurboOddEven:
  stage: testPhase3
  variables:
    PRODUCT: TurboOddEven
  trigger: 
    project: rnd/testing/mocha-playwright
    strategy: depend
  rules:
    - if: $PRODUCT == "All"
